name: Backend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Offline backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      AUTH_DATABASE_URL: postgresql+psycopg2://tpu_test:synthetic@127.0.0.1:55440/tpu_auth_test
      ANALYTICS_DATABASE_URL: postgresql+psycopg2://tpu_test:synthetic@127.0.0.1:55440/tpu_analytics_test
      TPU_CLIENT_ID: synthetic
      TPU_CLIENT_SECRET: synthetic
      TPU_API_KEY: synthetic
      TPU_REDIRECT_URI: https://tpu-metrics.duckdns.org/auth/tpu/callback
      TPU_FRONTEND_URL: https://tpu-metrics.duckdns.org
      TPU_COOKIE_SECURE: 'true'
      PROJECT_API_ALLOWED_HOSTS: redmine.example.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q auth_service analytics_service gitlab_service redmine_service
      - name: Test integration contracts and dashboard logic (mocked, no DB or live tokens)
        run: |
          python -m unittest -v \
            test_provider_token_contracts \
            test_connection_lifecycle \
            test_mixed_provider_snapshot \
            test_project_snapshot_selection \
            test_dashboard_student_metrics \
            test_dashboard_extras \
            test_browser_security

  build:
    name: Build and publish immutable backend image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cheba0/project-productivity-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to Cloud.ru (environment approval)
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.BACKEND_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      CLOUD_SSH_HOST: ${{ vars.CLOUD_SSH_HOST }}
      CLOUD_SSH_USER: ${{ vars.CLOUD_SSH_USER }}
      CLOUD_RUNTIME_ENV_PATH: ${{ vars.CLOUD_RUNTIME_ENV_PATH }}
      CLOUD_REDMINE_ENV_PATH: ${{ vars.CLOUD_REDMINE_ENV_PATH }}
      CLOUD_SSH_PRIVATE_KEY: ${{ secrets.CLOUD_SSH_PRIVATE_KEY }}
      CLOUD_SSH_KNOWN_HOSTS: ${{ secrets.CLOUD_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH upload and deploy with backups, migrations and health checks
        shell: bash
        run: |
          set -euo pipefail
          for var in CLOUD_SSH_HOST CLOUD_SSH_USER CLOUD_RUNTIME_ENV_PATH CLOUD_REDMINE_ENV_PATH CLOUD_SSH_PRIVATE_KEY CLOUD_SSH_KNOWN_HOSTS GHCR_TOKEN; do
            test -n "${!var}" || { echo "Missing deployment configuration: $var"; exit 1; }
          done
          [[ "$CLOUD_RUNTIME_ENV_PATH" = /* && "$CLOUD_REDMINE_ENV_PATH" = /* ]] || {
            echo "Cloud runtime env paths must be absolute"; exit 1;
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$CLOUD_SSH_PRIVATE_KEY" > "$HOME/.ssh/backend_deploy_key"
          printf '%s\n' "$CLOUD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/backend_deploy_key" "$HOME/.ssh/known_hosts"
          ssh_opts=(-i "$HOME/.ssh/backend_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          target="$CLOUD_SSH_USER@$CLOUD_SSH_HOST"
          image="ghcr.io/cheba0/project-productivity-backend:${{ github.sha }}"
          sha="${{ github.sha }}"
          ssh -T "${ssh_opts[@]}" "$target" "umask 077; mkdir -p \"\$HOME/.tpu-metrics-release/ci-cd/$sha\""
          scp "${ssh_opts[@]}" \
            backend/docker-compose.yml \
            backend/compose.services.yml \
            backend/compose.cloud-redmine.yml \
            backend/compose.ghcr.yml \
            "$target:.tpu-metrics-release/ci-cd/$sha/"
          logged_in=0
          logout_remote() {
            if [[ "$logged_in" == "1" ]]; then
              ssh -T "${ssh_opts[@]}" "$target" 'docker logout ghcr.io >/dev/null 2>&1 || true' || true
            fi
          }
          trap logout_remote EXIT
          printf '%s' "$GHCR_TOKEN" | ssh -T "${ssh_opts[@]}" "$target" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          logged_in=1
          ssh -T "${ssh_opts[@]}" "$target" \
            "bash -s -- '$sha' '$image' '$CLOUD_RUNTIME_ENV_PATH' '$CLOUD_REDMINE_ENV_PATH'" \
            < backend/deploy/remote_deploy.sh
